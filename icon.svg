  <g transform="translate(198 68) rotate(9)">
    <rect x="-24" y="-24" width="48" height="48" rx="10" fill="#f472b6" stroke="#090d16" stroke-width="6"/>
    <rect x="-17" y="-17" width="34" height="34" rx="6" fill="#facc15"/>
    <text x="0" y="9" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="28" fill="#090d16">?</text>
  </g>
  <!-- Hero 3D Blocky Red Getaway Muscle Car + Twin RPG -->
  <g transform="translate(128 168) rotate(-4)">
    <rect x="-66" y="10" width="28" height="26" rx="6" fill="#090d16"/>
    <rect x="38" y="10" width="28" height="26" rx="6" fill="#090d16"/>
    <rect x="-66" y="-22" width="132" height="42" rx="10" fill="#ef4444" stroke="#090d16" stroke-width="7"/>
    <rect x="-11" y="-22" width="22" height="40" rx="3" fill="#fde047"/>
