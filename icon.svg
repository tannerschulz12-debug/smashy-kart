<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d142e"/>
      <stop offset="48%" stop-color="#263062"/>
      <stop offset="49%" stop-color="#1e2536"/>
      <stop offset="100%" stop-color="#0f1420"/>
    </linearGradient>
    <radialGradient id="redBeam" cx="0.2" cy="0.38" r="0.45">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueBeam" cx="0.82" cy="0.38" r="0.45">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" rx="54" fill="url(#sky)"/>
  <rect width="256" height="256" rx="54" fill="url(#redBeam)"/>
  <rect width="256" height="256" rx="54" fill="url(#blueBeam)"/>
  <!-- Perspective Asphalt Highway -->
  <polygon points="88,120 168,120 256,256 0,256" fill="#1e293b"/>
  <polygon points="124,128 132,128 136,162 120,162" fill="#facc15"/>
  <polygon points="118,178 138,178 144,232 112,232" fill="#facc15"/>
