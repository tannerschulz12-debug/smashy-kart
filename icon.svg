    <!-- Headlights -->
    <rect x="-56" y="-10" width="18" height="11" rx="3" fill="#fef08a" stroke="#090d16" stroke-width="3"/>
    <rect x="38" y="-10" width="18" height="11" rx="3" fill="#fef08a" stroke="#090d16" stroke-width="3"/>
