    <rect x="-32" y="-44" width="64" height="18" rx="4" fill="#7dd3fc"/>
    <!-- Twin RPG Tubes -->
    <rect x="-44" y="-62" width="18" height="13" rx="3" fill="#4d7c0f" stroke="#090d16" stroke-width="4"/>
    <rect x="26" y="-62" width="18" height="13" rx="3" fill="#4d7c0f" stroke="#090d16" stroke-width="4"/>
    <circle cx="-35" cy="-55.5" r="3.5" fill="#ef4444"/>
